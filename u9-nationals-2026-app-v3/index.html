<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09172b" />
  <meta name="description" content="South Australia U9 Inline Hockey Nationals 2026 team hub" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SA U9 Nationals" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="icon" type="image/png" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>SA U9 Nationals 2026</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <img src="./assets/sa-puck.png" alt="South Australia Inline Hockey Club" class="brand-logo" />
      <div class="brand-copy">
        <strong>SA U9 Nationals 2026</strong>
        <span>South Australia · Inline Hockey</span>
      </div>
      <button id="installBtn" class="install-btn" hidden>Install</button>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-view="schedule" class="nav-item"><span>▦</span><small>Schedule</small></button>
      <button data-view="team" class="nav-item"><span>●●●</span><small>Team</small></button>
      <button data-view="checklist" class="nav-item"><span>✓</span><small>Checklist</small></button>
      <button data-view="info" class="nav-item"><span>i</span><small>Info</small></button>
    </nav>
  </div>
  <script src="./app-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
