name: Sync team photos
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read public Drive folder
        run: python scripts/sync_photos.py
      - name: Commit gallery data when changed
        run: |
          if git diff --quiet -- photo-data.js photo-sync-debug.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-data.js photo-sync-debug.json
          git commit -m "Update team photo gallery"
          git push
