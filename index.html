<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102f5d" />
  <meta name="description" content="SA U9 Inline Hockey Nationals 2026 team hub" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SA U9 Nationals" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>SA U9 Nationals 2026</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">SA</div>

        <strong>SA U9 Nationals 2026</strong>
        <span>Inline Hockey · Queensland</span>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="home" class="nav-item active"><span>🏠</span><small>Home</small></button>
      <button data-view="team" class="nav-item"><span>👥</span><small>Team</small></button>
      <button data-view="schedule" class="nav-item"><span>📅</span><small>Schedule</small></button>
      <button data-view="checklist" class="nav-item"><span>✅</span><small>Checklist</small></button>
      <button data-view="info" class="nav-item"><span>🔗</span><small>Info</small></button>
    </nav>

  <script src="./app-data.js"></script>
  <script src="./app.js"></script>

</html>
